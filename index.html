<style>

}

   const c=document.createElement('div'); c.className='raincol';
   c.style.left=(i*(100/cols)+Math.random()*2)+'%';

   for(let j=0;j<R(28,65);j++) chars+=pick([...rainGlyphs])+'\n';

 }
}
const rainPositions=[
 {l:62,t:5,w:34,h:38},{l:3,t:55,w:38,h:36},{l:55,t:52,w:42,h:40},
 {l:5,t:6,w:31,h:44},{l:35,t:18,w:34,h:52},{l:67,t:34,w:29,h:47}
];

const codeTokens=[
 '7F','A3','0D','FF','E1','09','4C','B7','∆','λ','//','::','<>','[]','{}',
 'PTR','MEM','IRQ','NODE','HASH','MUX','SYNC','VOID','ECHO','ROUTE','CACHE',
 '0xDEAD','0xBEEF','0110','1011','ACK','NUL','RX','TX','SEED','FORK','STACK',
 'GLASS','WIRE','SIGNAL','PHASE','VECTOR','SHARD','KERNEL','TRACE','SYNAPSE'
];

function codeChunk(){
 let out=[];
 const n=R(24,62);
 for(let i=0;i<n;i++){
   if(Math.random()<.22) out.push(R(0,65535).toString(16).padStart(4,'0').toUpperCase());
   else if(Math.random()<.16) out.push(Math.random().toString(2).slice(2,10));
   else out.push(pick(codeTokens));
 }
 return out;
}

function makeStream(force=false){
 const chance=Number(chaos.value)/100;
 if(!force && Math.random() > .12 + chance*.34) return;

 const layer=document.createElement('div');
 layer.className='stream';

 const angle=pick([-155,-135,-118,-72,-48,-27,-12,0,14,31,52,73,108,137,162,180]);
 const rad=angle*Math.PI/180;
 const length=Math.hypot(innerWidth,innerHeight)*1.65;
 const startX=R(-Math.round(innerWidth*.15),Math.round(innerWidth*1.05));
 const startY=R(-Math.round(innerHeight*.15),Math.round(innerHeight*1.05));

 layer.style.width=length+'px';
 layer.style.left=startX+'px';
 layer.style.top=startY+'px';
 layer.style.transform=`rotate(${angle}deg)`;
 layer.style.opacity='0';

 const tokens=codeChunk();
 tokens.forEach((tok,i)=>{
   const s=document.createElement('span');
   s.textContent=tok+' ';
   if(i===0) s.className='head';
   else s.className=Math.random()<.16?'hot':(Math.random()<.22?'dim':'');
   layer.appendChild(s);
 });

 const band=document.createElement('div');
 band.className='stream-band';
 layer.appendChild(band);
 streams.appendChild(layer);

 const duration=R(1600,4300);
 const travel=R(Math.round(length*.22),Math.round(length*.58));
 const driftX=Math.cos(rad)*travel, driftY=Math.sin(rad)*travel;

 const anim=layer.animate([
   {transform:`translate(${-driftX*.20}px,${-driftY*.20}px) rotate(${angle}deg)`,opacity:0,filter:'blur(.5px)'},
   {offset:.08,opacity:R(12,30)/100,filter:'blur(0px)'},
   {offset:.28,opacity:R(20,42)/100},
   {offset:.72,opacity:R(14,34)/100},
   {transform:`translate(${driftX}px,${driftY}px) rotate(${angle}deg)`,opacity:0,filter:'blur(.35px)'}
 ],{duration,easing:'linear'});

 // Rewrite pieces while moving so this feels like live computation, not floating text.
 const mutate=setInterval(()=>{
   const spans=layer.querySelectorAll('span');
   for(let j=0;j<R(1,5);j++){
     const s=spans[R(0,spans.length-1)];
     if(s) s.textContent=(Math.random()<.45
       ? R(0,65535).toString(16).padStart(4,'0').toUpperCase()
       : pick(codeTokens))+' ';
   }
 },R(55,125));

 anim.onfinish=()=>{clearInterval(mutate);layer.remove()};
}

}

 for(const ch of text){
   while(!running) await sleep(80);
   cursor.before(document.createTextNode(ch)); clickSound();

     ? R(Math.max(8,base+8),Math.max(20,base+48))

   if(/[.:?!]/.test(ch) && Math.random()<.13) wait+=R(30,150);
   await sleep(wait);
 }

 cursor.remove();
 term.scrollTop=term.scrollHeight;
 await sleep(R(20,Math.max(35,(101-Number(speed.value))*7)));
}

   for(let i=0;i<5 && active;i++){

async function errorStorm(){clearIncidents();for(let i=0;i<30;i++){let m=pick(errs);win('errorwin',m[0],m[1]);errorDing();if(i==10||i==20)screenFlash();await sleep(Math.max(35,290-i*8))}setTimeout(clearIncidents,11000)}

async function davinci(){
 // Kill any prior Da Vinci run cleanly before starting another.

 const d=document.createElement('div');
 d.id='davinciLayer';
 d.innerHTML=`<div id="davinciCore"><canvas id="dvCanvas"></canvas></div>
 <div class="dvtext" id="dvlog">[VIRUS] DA_VINCI payload detected</div>`;

 const height=Math.max(240,rect.height);
 const canvas=d.querySelector('#dvCanvas');
 const ctx=canvas.getContext('2d');
 const log=d.querySelector('#dvlog');
 const ratio=Math.min(2,window.devicePixelRatio||1);

 canvas.width=Math.floor(width*ratio);
 canvas.height=Math.floor(height*ratio);
 canvas.style.width=width+'px';
 canvas.style.height=height+'px';
 ctx.setTransform(ratio,0,0,ratio,0,0);

 const nodes=[];
 const edges=[];
 const queue=[];
 const MAX_DIVISIONS=40;
 let divisions=0;
 let animationFrame=0;
 let finished=false;

 const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
 const root={
   x:width/2,y:height/2,radius:5,generation:0,
   parent:null,children:[],born:performance.now(),rogue:false
 };
 nodes.push(root);
 queue.push(root);

   return runId===davinciRunId && d.isConnected && !finished;

 function reinforce(node){
   let gain=1.8;
   let p=node;
   while(p){
     p.radius=Math.min(p===root?28:20,p.radius+gain);
     gain*=.42;
     p=p.parent;
   }

 function chooseChildPosition(parent,angle,distance){
   const marginX=28, marginTop=28, marginBottom=95;
   let x=parent.x+Math.cos(angle)*distance;
   let y=parent.y+Math.sin(angle)*distance;

   // Reflect the direction if it leaves the visible canvas.
   if(x<marginX || x>width-marginX){
     angle=Math.PI-angle;
     x=parent.x+Math.cos(angle)*distance;
   }
   if(y<marginTop || y>height-marginBottom){
     angle=-angle;
     y=parent.y+Math.sin(angle)*distance;
   }
   return {
     x:clamp(x,marginX,width-marginX),
     y:clamp(y,marginTop,height-marginBottom)
   };
 }

 function child(parent,angle,distance,rogue=false){
   const pos=chooseChildPosition(parent,angle,distance);
   const n={
     x:pos.x,y:pos.y,radius:rogue?3.8:3.2,
     generation:parent.generation+1,parent,
     children:[],born:performance.now(),rogue
   };
   parent.children.push(n);
   nodes.push(n);
   edges.push({a:parent,b:n,born:performance.now(),duration:360,rogue});
   queue.push(n);
   return n;
 }

 function divide(parent){
   if(!valid() || divisions>=MAX_DIVISIONS)return;
   divisions++;

   // Direction follows the parent's existing trajectory.
   const base=parent.parent
     ? Math.atan2(parent.y-parent.parent.y,parent.x-parent.parent.x)
     : -Math.PI/2 + (Math.random()-.5)*.5;

   const spread=.72;
   const distance=Math.min(190,Math.max(100,Math.min(width,height)*.13));

   child(parent,base-spread+(Math.random()-.5)*.12,distance,false);
   child(parent,base+spread+(Math.random()-.5)*.12,distance,false);

   // Guaranteed rogue branches at known divisions, plus a modest random chance.
   const guaranteed=[7,13,19,25,31,37].includes(divisions);
   const randomRogue=divisions>5 && Math.random()<.20;
   const rogue=guaranteed || randomRogue;

   if(rogue){
     const rogueAngle=base+(Math.random()<.5?-1:1)*(1.65+Math.random()*.65);
     child(parent,rogueAngle,Math.min(230,distance*1.25),true);
   }

   reinforce(parent);

   log.textContent+=`\n[REPL] ${String(divisions).padStart(2,'0')}/${MAX_DIVISIONS}  G${parent.generation}`;
   if(rogue)log.textContent+='  // ROGUE BRANCH';
 }

 function render(now){
   if(!valid())return;
   ctx.clearRect(0,0,width,height);
   ctx.lineCap='round';

   for(const e of edges){
     const progress=Math.min(1,(now-e.born)/e.duration);
     const ex=e.a.x+(e.b.x-e.a.x)*progress;
     const ey=e.a.y+(e.b.y-e.a.y)*progress;
     ctx.beginPath();
     ctx.moveTo(e.a.x,e.a.y);
     ctx.lineTo(ex,ey);
     ctx.strokeStyle=e.rogue
       ? `rgba(205,255,220,${.30+.60*progress})`
       : `rgba(115,255,156,${.20+.52*progress})`;
     ctx.lineWidth=e.rogue?1.8:1.15;
     ctx.shadowBlur=e.rogue?12:7;
     ctx.shadowColor='rgba(115,255,156,.55)';
     ctx.stroke();
   }

   for(const n of nodes){
     const age=Math.min(1,(now-n.born)/260);
     const pulse=1+Math.sin(now*.006+n.generation)*.045;
     ctx.beginPath();
     ctx.arc(n.x,n.y,Math.max(.5,n.radius*age*pulse),0,Math.PI*2);
     ctx.fillStyle=n===root
       ? 'rgba(235,255,240,.98)'
       : n.rogue?'rgba(200,255,218,.96)':'rgba(115,255,156,.88)';
     ctx.shadowBlur=n===root?18:9;
     ctx.shadowColor='rgba(115,255,156,.7)';
     ctx.fill();
   }

   animationFrame=requestAnimationFrame(render);
 }
 animationFrame=requestAnimationFrame(render);

 // Deterministic queue: exactly one parent division per cycle until 40.
 // No generation/frontier exhaustion and no dependency on animation callbacks.
 while(valid() && divisions<MAX_DIVISIONS){
   const parent=queue.shift();
   if(!parent)break;
   divide(parent);

   // Keep visual effects from replacing/removing the incident DOM.
   if(divisions%8===0)glitchSound();

   await sleep(330);
 }

 if(valid()){
   log.textContent+=`\n[CRITICAL] DIVISION LIMIT REACHED: ${divisions}/${MAX_DIVISIONS}`;
   log.textContent+=`\n[MEM] ACTIVE NODES: ${nodes.length}`;
   log.textContent+=`\n[WARN] ROOT MASS: ${root.radius.toFixed(1)}`;
   log.textContent+=`\n[AUDIO] HACK THE PLANET`;
   await sleep(3000);
 }

 finished=true;
 cancelAnimationFrame(animationFrame);

 // Only this run is allowed to clear itself.
 if(runId===davinciRunId){
   screenFlash();
   await sleep(450);
   clearIncidents();
 }
}

let audioCtx=null, masterGain=null, soundOn=false, humOsc=null, humGain=null;

function initAudio(){
 if(audioCtx)return;
 audioCtx=new (window.AudioContext||window.webkitAudioContext)();
 masterGain=audioCtx.createGain();
 masterGain.gain.value=Number(document.querySelector('#volume').value)/100*.42;
 masterGain.connect(audioCtx.destination);
}
function setVolume(){
 if(masterGain) masterGain.gain.setTargetAtTime(Number(document.querySelector('#volume').value)/100*.42,audioCtx.currentTime,.03);
}
function tone(freq=440,dur=.08,type='square',gain=.04,slide=0){
 if(!soundOn)return;
 initAudio(); if(audioCtx.state==='suspended')audioCtx.resume();
 const o=audioCtx.createOscillator(),g=audioCtx.createGain();
 o.type=type;o.frequency.setValueAtTime(freq,audioCtx.currentTime);
 if(slide)o.frequency.exponentialRampToValueAtTime(Math.max(20,freq+slide),audioCtx.currentTime+dur);
 g.gain.setValueAtTime(.0001,audioCtx.currentTime);
 g.gain.exponentialRampToValueAtTime(gain,audioCtx.currentTime+.006);
 g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
 o.connect(g);g.connect(masterGain);o.start();o.stop(audioCtx.currentTime+dur+.02);
}
function noise(dur=.08,gain=.025){
 if(!soundOn)return;initAudio();
 const len=Math.floor(audioCtx.sampleRate*dur),buf=audioCtx.createBuffer(1,len,audioCtx.sampleRate),data=buf.getChannelData(0);
 for(let i=0;i<len;i++)data[i]=(Math.random()*2-1);
 const src=audioCtx.createBufferSource(),g=audioCtx.createGain();src.buffer=buf;
 g.gain.setValueAtTime(gain,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(.0001,audioCtx.currentTime+dur);
 src.connect(g);g.connect(masterGain);src.start();
}

let magicSequenceToken=0;

function magicVowel(freq, delay, runId){
 if(!soundOn)return;
 setTimeout(()=>{
   if(!soundOn || runId!==magicSequenceToken)return;
   initAudio();
   if(audioCtx.state==='suspended') audioCtx.resume();

   const now=audioCtx.currentTime;
   const dur=.19;
   const out=audioCtx.createGain();
   out.gain.setValueAtTime(.0001,now);
   out.gain.exponentialRampToValueAtTime(.16,now+.018);
   out.gain.exponentialRampToValueAtTime(.0001,now+dur);
   out.connect(masterGain);

   // Strong voiced fundamental.
   const voice=audioCtx.createOscillator();
   voice.type='sawtooth';
   voice.frequency.setValueAtTime(freq,now);
   voice.frequency.linearRampToValueAtTime(freq*.96,now+dur);
   voice.connect(out);
   voice.start(now); voice.stop(now+dur);

   // "AH" formant layer.
   [720,1120].forEach((formant,i)=>{
     const osc=audioCtx.createOscillator();
     const filter=audioCtx.createBiquadFilter();
     const gain=audioCtx.createGain();
     osc.type='sawtooth';
     osc.frequency.value=freq*(i+2);
     filter.type='bandpass';
     filter.frequency.value=formant;
     filter.Q.value=2.2;
     gain.gain.value=i===0?.34:.20;
     osc.connect(filter); filter.connect(gain); gain.connect(out);
     osc.start(now); osc.stop(now+dur);
   });
 },delay);
}

function magicTriplet(startDelay,runId){
 // Semi-quick, clearly rising three-syllable phrase.
 magicVowel(115,startDelay,runId);
 magicVowel(145,startDelay+205,runId);
 magicVowel(182,startDelay+410,runId);
}

function startMagicVoiceSequence(){

 // Five complete AH-AH-AH groups.
 [0,900,1800,2700,3600].forEach(delay=>magicTriplet(delay,runId));
}

function synthAh(delay=0){
 if(!soundOn)return;
 setTimeout(()=>{
   initAudio();
   const now=audioCtx.currentTime,dur=.17;
   const g=audioCtx.createGain(),f=audioCtx.createBiquadFilter();
   f.type='bandpass';f.frequency.value=760;f.Q.value=3.2;
   g.gain.setValueAtTime(.0001,now);
   g.gain.exponentialRampToValueAtTime(.075,now+.025);
   g.gain.exponentialRampToValueAtTime(.0001,now+dur);
   f.connect(g);g.connect(masterGain);
   [118,236].forEach((hz,i)=>{
     const o=audioCtx.createOscillator();o.type=i?'square':'sawtooth';
     o.frequency.setValueAtTime(hz,now);o.frequency.linearRampToValueAtTime(hz*.91,now+dur);
     o.connect(f);o.start(now);o.stop(now+dur);
   });
 },delay);
}

}

function entityBlip(ch){
 if(!soundOn||/\s/.test(ch))return;
 initAudio();
 const now=audioCtx.currentTime, dur=R(45,85)/1000;
 const fundamental=R(78,118);
 const g=audioCtx.createGain();
 const filter=audioCtx.createBiquadFilter();
 filter.type='bandpass';
 filter.frequency.value=R(650,1250);
 filter.Q.value=R(3,8);
 g.gain.setValueAtTime(.0001,now);
 g.gain.exponentialRampToValueAtTime(.045,now+.008);
 g.gain.exponentialRampToValueAtTime(.0001,now+dur);
 filter.connect(g); g.connect(masterGain);
 ['sawtooth','square'].forEach((type,i)=>{
   const o=audioCtx.createOscillator();
   o.type=type; o.frequency.value=fundamental*(i+1);
   o.detune.value=R(-18,18);
   o.connect(filter); o.start(now); o.stop(now+dur);
 });
 if(/[aeiou]/i.test(ch)){
   const o=audioCtx.createOscillator(), fg=audioCtx.createGain();
   o.type='sine'; o.frequency.value=R(180,260);
   fg.gain.value=.018; o.connect(fg); fg.connect(masterGain);
   o.start(now); o.stop(now+dur*1.25);
 }
}
